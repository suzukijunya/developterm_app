<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>シティデュエル - ライドカロリー</title>
<meta name="theme-color" content="#050608" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="stylesheet" href="css/style.css?v=2026.11.59" />
<link rel="stylesheet" href="css/duelist.css?v=2026.11.59" />
<link rel="stylesheet" href="css/cinema.css?v=2026.11.59" />
<link rel="stylesheet" href="css/board.css?v=2026.11.59" />
<link rel="stylesheet" href="css/tcard.css?v=2026.11.59" />
<link rel="stylesheet" href="css/city.css?v=2026.11.59" />
</head>
<body class="city">
<div id="ct-view"></div>

<section id="ct-setup" class="ct-setup">
  <a class="ct-back" href="index.html">← 戻る</a>
  <h1>CITY <b>DUEL</b></h1>
  <p class="ct-lead">実際の街を3Dで走りながら進めるライディングデュエル(家で遊ぶ用)</p>
  <label>出発<select id="ct-from"></select></label>
  <label>目的地<select id="ct-to"></select></label>
  <label>ライバルの速さ<select id="ct-rival"><option value="22">ゆっくり(22km/h)</option><option value="25" selected>ふつう(25km/h)</option><option value="28">速い(28km/h)</option><option value="32">とても速い(32km/h)</option></select></label>
  <label class="ct-check"><input type="checkbox" id="ct-auto0" /> 自動でこぐ(見るだけ)</label>
  <button class="btn start" id="ct-go">スタート</button>
  <p id="ct-msg" class="ct-msg"></p>
  <p class="ct-note">街の建物と道は OpenStreetMap の地図タイル(OpenFreeMap)から取ります。送るのは、出発と目的地の位置と、ルートが通る地図の区画(約2km四方)の番号だけです。一度取った街は端末に保存します。<br />© OpenStreetMap contributors ・ OpenFreeMap ・ OpenMapTiles</p>
</section>

<div id="ct-hud" class="ct-hud" hidden>
  <div id="ct-lp" class="ct-lp"></div>
  <div class="ct-left">
    <div class="ct-speedbox"><b id="ct-speed">0</b><small>km/h</small></div>
    <div id="ct-power" class="ct-power">0 W</div>
    <div id="ct-gap" class="ct-gap"></div>
    <div id="ct-remain" class="ct-remain"></div>
    <div class="ct-time">⏱ <span id="ct-time">0:00</span></div>
  </div>
  <div class="ct-right">
    <canvas id="ct-mini" width="150" height="150"></canvas>
    <div id="ct-ticker" class="ct-ticker"></div>
  </div>
  <div id="ct-hand" class="ct-hand"></div>
  <div class="ct-ctrl">
    <button id="ct-brake" class="ct-btn brake">ブレーキ</button>
    <button id="ct-pedal" class="ct-btn pedal">こぐ<small>押している間</small></button>
    <button id="ct-sprint" class="ct-btn sprint">スプリント<i><u id="ct-stam"></u></i></button>
  </div>
  <div class="ct-opts">
    <label><input type="checkbox" id="ct-auto" /> 自動</label>
    <label>速さ <select id="ct-x"><option value="1">×1</option><option value="2">×2</option><option value="5">×5</option><option value="10">×10</option><option value="20">×20</option></select></label>
    <label><input type="checkbox" id="ct-voice" checked /> 声</label>
    <a href="index.html">やめる</a>
  </div>
  <div id="ct-where" class="ct-where"></div>
  <div id="ct-near" class="ct-near" hidden></div>
  <div id="ct-map-state" class="ct-map-state"></div>
  <div class="ct-osm">© OpenStreetMap contributors ・ OpenFreeMap</div>
</div>
<div id="ct-wait" class="ct-wait" hidden><b>街を読み込み中…</b><small></small></div>
<div id="ct-result" class="ct-result" hidden></div>

<script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>
<script src="js/store.js?v=2026.11.59"></script>
<script src="js/nav.js?v=2026.11.59"></script>
<script src="js/physics.js?v=2026.11.59"></script>
<script src="js/eta.js?v=2026.11.59"></script>
<script src="js/duel.js?v=2026.11.59"></script>
<script src="js/battle.js?v=2026.11.59"></script>
<script src="js/tcard.js?v=2026.11.59"></script>
<script src="js/duelfx.js?v=2026.11.59"></script>
<script src="js/cinema.js?v=2026.11.59"></script>
<script src="js/board.js?v=2026.11.59"></script>
<script src="js/monart.js?v=2026.11.59"></script>
<script src="js/duellines.js?v=2026.11.59"></script>
<script src="js/city.js?v=2026.11.59"></script>
</body>
</html>
